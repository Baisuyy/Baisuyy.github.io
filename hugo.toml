baseURL = "https://blog.kelibb.top/"
title = "Keli's Blog"
theme = "PaperMod"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  description = "Keli's personal blog - tech, life, and random thoughts"
  author = "Keli"
  homeInfoParams = { Title = "Hi, I'm Keli", Content = "Welcome to my blog. I write about tech, life, and random thoughts." }
  socialIcons = [
    { name = "github", url = "https://github.com/Baisuyy" },
    { name = "email", url = "mailto:your@email.com" }
  ]
  profileMode = { enabled = true, title = "Keli's Blog", subtitle = "Tech | Life | Random", imageUrl = "", imageTitle = "Avatar", buttons = [
    { name = "Posts", url = "/posts" },
    { name = "Tags", url = "/tags" },
    { name = "About", url = "/about" }
  ]}
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowCodeCopyButtons = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowToc = true
  TocOpen = false
  hideMeta = false
  hideSummary = false
  hidePagination = false

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "/tags"
    weight = 20
  [[menu.main]]
    name = "Archive"
    url = "/archives"
    weight = 30
  [[menu.main]]
    name = "About"
    url = "/about"
    weight = 40
  [[menu.main]]
    name = "Search"
    url = "/search"
    weight = 50

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github"
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
